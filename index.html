<title>In Loving Memory of Mosegelane Rein Thipa</title>
<meta name="description" content="In loving memory of Mosegelane Rein Thipa, 16 August 1946 to 29 September 2026.">
<meta property="og:title" content="In Loving Memory of Mosegelane Rein Thipa">
<meta property="og:description" content="16 August 1946 to 29 September 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF7EE;
    --paper: #FFFDF8;
    --gold: #B8913A;
    --gold-soft: #D9C38F;
    --ink: #3A3226;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 24px 16px 56px;
  }
  .memorial {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--gold-soft);
    box-shadow: 0 6px 24px rgba(120, 95, 40, 0.12);
    background: var(--paper);
  }
  h1 {
    margin: 44px 0 6px;
    text-align: center;
    font-weight: 500;
    font-style: italic;
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    color: var(--gold);
    letter-spacing: 0.01em;
  }
  .rule {
    width: 120px;
    height: 1px;
    margin: 0 auto 28px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  section.song { margin: 0 0 32px; }
  h2 {
    margin: 0 0 10px;
    text-align: center;
    font-weight: 500;
    font-size: clamp(1.25rem, 4.5vw, 1.45rem);
    color: var(--ink);
  }
  h2 small {
    display: block;
    font-size: 0.8em;
    font-style: italic;
    color: var(--gold);
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 1px solid var(--gold-soft);
  }
  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  @media (min-width: 700px) {
    main { padding-top: 40px; }
  }
</style>
</head>
